<!doctype html>
<html>
<head><title>ブログ一覧</title></head>
<body>
<h1>ブログ一覧</h1>
<a href="/create">新規投稿</a>
<ul>
  {% for post in posts %}
    <li>
      <strong>{{ post.title }}</strong> by {{ post.author }} ({{ post.created_at.strftime('%Y-%m-%d') }}) 
      - <a href="/edit/{{ post.id }}">編集</a> 
      - <a href="/delete/{{ post.id }}">削除</a>
      <p>{{ post.content }}</p>
      <small>Tags: {{ post.tags }}</small>
    </li>
  {% endfor %}
</ul>
</body>
</html>
